    <!--
      The theme the visitor chose, applied before first paint. Without it a visitor who picked light
      on a dark-mode machine sees one frame of the wrong world on every load — React cannot write
      the attribute until after it hydrates. Nothing is written when they have never chosen, so the
      untouched default stays the operating system's preference. AC-P9.
    -->
    <script>
      try {
        var t = localStorage.getItem("tema");
        if (t) document.documentElement.setAttribute("data-theme", t);
      } catch (e) { /* private mode: the OS preference rules, which is the correct fallback */ }
    </script>
